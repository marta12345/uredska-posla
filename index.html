<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <!-- @ favicon na tabu preglednika -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233B2E5A'/%3E%3Ctext x='50' y='52' font-size='68' font-family='Arial, sans-serif' font-weight='bold' fill='%23FFF48F' text-anchor='middle' dominant-baseline='central'%3E@%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@ Uredska posla</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Datum/vrijeme — fiksirano gore desno, izvan svega -->
    <div class="datetime" id="datetime"></div>

    <div class="shell" id="shell">
      <!-- Lijevi izbornik -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <div class="brand">
            <span class="brand-badge">@</span>
            <h1 class="brand-title">
              <span class="brand-full">Uredska posla</span>
              <span class="brand-short">UP</span>
            </h1>
          </div>
          <button
            class="sidebar-toggle"
            id="sidebar-toggle"
            title="Smanji / proširi izbornik"
            aria-label="Smanji ili proširi izbornik"
          >
            «
          </button>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav">
          <button class="nav-card active" data-view="tasks">
            <span class="nav-icon">📋</span>
            <span class="nav-text">Popis zadataka</span>
          </button>
          <button class="nav-card" data-view="colleagues">
            <span class="nav-icon">👥</span>
            <span class="nav-text">Popis kolega</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <button class="theme-toggle" id="theme-toggle" title="Promijeni temu">
            <span class="nav-icon" id="theme-icon">🌙</span>
            <span class="nav-text">Promijeni temu</span>
          </button>
        </div>
      </aside>

      <!-- Glavni sadržaj -->
      <div class="content">
        <!-- Naslov koji se prikazuje samo kad je sidebar skupljen -->
        <header class="content-brand" id="content-brand">
          <h1 class="content-brand-title">Uredska posla</h1>
        </header>

        <!-- PRIKAZ: Popis zadataka -->
        <div class="view" id="view-tasks">
          <section class="stats">
            <div class="stat-card">
              <span class="stat-num" id="stat-total">0</span>
              <span class="stat-label">Ukupno</span>
            </div>
            <div class="stat-card stat-todo">
              <span class="stat-num" id="stat-todo">0</span>
              <span class="stat-label">Za napraviti</span>
            </div>
            <div class="stat-card stat-progress">
              <span class="stat-num" id="stat-progress">0</span>
              <span class="stat-label">U tijeku</span>
            </div>
            <div class="stat-card stat-done">
              <span class="stat-num" id="stat-done">0</span>
              <span class="stat-label">Gotovo</span>
            </div>
          </section>

          <div class="layout">
            <aside class="form-panel">
              <h3>Novi zadatak</h3>
              <form id="task-form" class="task-form">
                <label>
                  Naslov *
                  <input type="text" id="f-title" placeholder="npr. Pripremiti izvještaj" required />
                </label>
                <label>
                  Opis
                  <textarea id="f-desc" placeholder="Kratak opis zadatka" rows="3"></textarea>
                </label>
                <label>
                  Dodijeljeno
                  <select id="f-assignee">
                    <option value="">— odaberi kolegu —</option>
                  </select>
                </label>
                <div class="form-row">
                  <label>
                    Prioritet
                    <select id="f-priority">
                      <option value="low">Niski</option>
                      <option value="medium" selected>Srednji</option>
                      <option value="high">Visoki</option>
                    </select>
                  </label>
                  <label>
                    Rok
                    <input type="date" id="f-deadline" />
                  </label>
                </div>
                <button type="submit" class="btn-primary">Dodaj zadatak</button>
              </form>
            </aside>

            <main class="tasks-panel">
              <div class="toolbar">
                <input type="search" class="search" id="search" placeholder="Pretraži zadatke…" />
                <div class="filters" id="filters">
                  <button class="chip active" data-filter="all">Svi</button>
                  <button class="chip" data-filter="todo">Za napraviti</button>
                  <button class="chip" data-filter="in-progress">U tijeku</button>
                  <button class="chip" data-filter="done">Gotovo</button>
                </div>
              </div>
              <ul class="task-list" id="task-list"></ul>
            </main>
          </div>
        </div>

        <!-- PRIKAZ: Popis kolega -->
        <div class="view hidden" id="view-colleagues">
          <header class="page-head">
            <h2 class="page-title">Popis kolega</h2>
            <p class="page-sub">Kolege kojima se mogu dodijeliti zadaci</p>
          </header>

          <div class="layout">
            <aside class="form-panel">
              <h3>Novi kolega</h3>
              <form id="colleague-form" class="task-form">
                <label>
                  Ime i prezime *
                  <input type="text" id="c-name" placeholder="npr. Ana Anić" required />
                </label>
                <label>
                  Uloga / odjel
                  <input type="text" id="c-role" placeholder="npr. Računovodstvo" />
                </label>
                <button type="submit" class="btn-primary">Dodaj kolegu</button>
              </form>
            </aside>

            <main class="tasks-panel">
              <ul class="colleague-list" id="colleague-list"></ul>
            </main>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <span class="brand-badge small">@</span> Uredska posla · podaci se spremaju lokalno u pregledniku
    </footer>

    <script src="app.js"></script>
  </body>
</html>
